name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          path: docs
          node-version: 22
          # docs/ is an npm workspace member (see ADR 0004) and has no
          # lockfile of its own — the root package-lock.json covers it.
          # withastro/action's package-manager auto-detection only looks
          # for a lockfile inside `path`, so it fails without this; `npm
          # install`/`npm run build` run with cwd=docs still correctly
          # resolve to the workspace root regardless.
          package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
