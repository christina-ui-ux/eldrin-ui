name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/eldrin-ui/src/components/**/*.stories.*'
      # Overview tab content is generated from each component's spec
      # (GlobalDocsContainer, docs/src/docs/) — a spec edit alone (no
      # .stories.tsx change) still needs to trigger a redeploy.
      - 'packages/eldrin-ui/src/components/**/*.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # docs/ is an npm workspace member (see ADR 0004) with no lockfile
        # of its own — install from the repo root so the root
        # package-lock.json is what's used.
        run: npm install
      - name: Build Storybook
        run: NODE_ENV=production npm run build-storybook --workspace docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
