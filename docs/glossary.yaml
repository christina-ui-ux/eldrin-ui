# eldrin-ui/docs/glossary.yaml
#
# Single source of truth for naming DECISIONS across the whole system —
# not a taxonomy tool. Just: for a given concept, which exact word
# did we commit to, and why. Reference this before introducing a new
# term for something that might already have one.
#
# status: decided | needs-decision
#   needs-decision entries are flagged, not guessed — do not pick one
#   silently in code or docs. Surface it and update this file first.
#
# supersedes: if set, this term replaces an earlier one used in prior
# examples/drafts. Old term should not appear in new code.
#
# forbidden: optional list of additional disallowed strings for this
# entry (alternate spellings, rejected synonyms) beyond `supersedes`.
# scripts/lint-glossary.mjs scans for both `supersedes` and `forbidden`
# on `decided` entries — kept as explicit fields rather than parsed
# out of `decision`/`rationale` prose, so the linter's behavior doesn't
# depend on how a sentence happens to be phrased.
#
# This file is enforced by `npm run lint:glossary` — see
# docs/decisions/0002-glossary-governance.md.

version: 1

entries:

  # ---- Components ----

  - term: PascalCase, no prefix
    category: component-naming
    decision: >
      Components are named in PascalCase with no system prefix —
      `Button`, `Card`, not `EldrinButton`. Named after function, not
      appearance.
    rationale: >
      Prefixing every component adds noise without disambiguating
      anything inside your own package; consistent with how Figma's own
      convention treats public components (no namespace prefix).
    status: decided

  - term: single component + variant prop
    category: component-naming
    decision: >
      One component per concept with an enum `variant` prop
      (`<Button variant="primary" />`), not separate components per
      visual variant (`ButtonPrimary`, `ButtonSecondary`).
    rationale: >
      Avoids combinatorial explosion across variant × size × state.
      Matches Material UI's API convention.
    status: decided

  # ---- Token structure ----

  - term: token layer order
    category: token-structure
    decision: "primitive -> semantic -> component (3 layers, in that order)."
    rationale: >
      Primitives are raw values (owned separately). Semantic tokens are
      the vocabulary (bg/text/border/icon x role x state). Component
      tokens are pure aliases into the semantic layer, resolved by the
      component's container/control classification.
    status: decided

  - term: semantic token naming formula
    category: token-structure
    decision: >
      `{element}.{family}.{concept}.{state}.{context}` (dot notation) is
      the canonical semantic token KEY — e.g. how a token is defined/
      referenced in the token source (`packages/eldrin-ui/src/tokens/`). The Tailwind
      utility class derived from a key replaces each `.` with `-`
      (`bg.fill.primary.hover` -> `bg-fill-primary-hover`). Dot form and
      hyphenated form are the same token, not competing notations —
      ADR 0001's `bg-surface-*` / `bg-fill-*` / `text-onFill-*` examples
      are the derived class form of this key.
    rationale: >
      element = bg/text/border/icon. family = surface/fill (structural
      role). concept = the meaning (see color-role entries below). state
      = interaction state. context = on-bg-fill/inverse/transparent.
      Fixed order, broad to specific.
    status: decided

  - term: semantic spacing naming
    category: token-structure
    decision: >
      `space.horizontal.<value>` / `space.vertical.<value>` (dot
      notation) — `horizontal`/`vertical` fills the naming formula's
      `concept` slot (no `family` segment, same shape as text/border/
      icon). `<value>` comes from one of two closed vocabularies,
      extended only by editing this entry, never invented ad hoc:
        - a classification word for padding/gaps inside one component,
          reused directly from "container / control" below: `control`
          (Input, Button) or `container` (Card, Modal).
          `space.horizontal.control` -> `--spacing-12` (12px `medium` /
          15px `large`, see ADR 0007).
        - `between-<thing>` for the gap between sibling elements rather
          than padding inside one, `<thing>` an existing structural
          noun (component name or named layout concept) — currently
          `between-section`, `between-card`.
      A bare primitive step (`space.horizontal.8`) is the fallback only
      for a genuine one-off fitting neither vocabulary.
      Not yet in `tokens-source/` (only the raw `space`/`scale`
      primitive is exported today — ADR 0008); this fixes the name
      ahead of a semantic spacing collection existing.
    rationale: >
      Mirrors component tokens aliasing the semantic layer (see "token
      layer order" above) instead of each component inventing its own
      one-off spacing value. Rejected two earlier drafts: bare step
      numbers alone ("just 12, that's stupid" — gives magnitude, not
      *why*), then a `base`/`content` classification-word split (still
      too abstract next to a directly readable `between-section`/
      `between-card`). `horizontal`/
      `vertical` was chosen over the CSS logical-property terms
      `inline`/`stack` for recognizability to component authors and
      designers, despite `inline`/`stack` being RTL-safe.
    status: decided

  - term: semantic radius naming
    category: token-structure
    decision: >
      `radius.control` (`--radius-control`) and `radius.container`
      (`--radius-container`), each aliasing an existing `space`/`scale`
      primitive step rather than a separate radius scale — `control` ->
      `--spacing-4` (4px `medium` / 5px `large`, see ADR 0007),
      `container` -> `--spacing-6` (6px `medium` / 8px `large`).
      `control` is for `control`-classified components (Button, Badge,
      Input); `container` is for `container`-classified components
      (Card, Modal, etc). `element` = `radius` (no `family` segment);
      `control`/`container` fill the `concept` slot. Not yet in
      `tokens-source/` (ADR 0008) — fixes the name ahead of a semantic
      radius collection existing.
    rationale: >
      Reuses the spacing scale instead of a second numeric scale needing
      its own steps kept in sync by hand. Split by container/control
      (mirroring "container / control" below) so a component's own
      blueprint already tells you which value it should use. Same words
      `space.horizontal.control`/`.container` already reuse directly for
      the same distinction.
    status: decided

  - term: token intent metadata
    category: token-structure
    decision: >
      Per-token intent (per CLAUDE.md/DESIGN.md) lives in
      `packages/eldrin-ui/src/tokens/intent.yaml`, keyed by the token's
      Figma `com.figma.variableId` — not its CSS var name, which can
      change on a Figma-side rename. Fields: `token`/`path`/`role`/
      `classification` (derived, kept in sync automatically), `status`
      (stable/experimental/deprecated), `deprecated.replacement`
      (required once deprecated), `usage` (what it's for), `notFor`
      (what it's explicitly not for), `pairsWith` (other tokens it's
      designed to pair with for accessibility). `npm run tokens:build`
      reconciles this file every run and fails the build if any tracked
      token is unreviewed. Only `semantics` tokens get an entry —
      `primitives`/`scale`/`components` are excluded. See ADR 0009 for
      the full mechanism and field-by-field reasoning.
    rationale: >
      Figma's own variable export carries no intent field (ADR 0008
      scoped it out), so it's hand-authored separately. Keyed by
      variableId instead of the derived var name so a Figma-side rename
      doesn't silently orphan the entry.
    status: decided

  - term: surface / fill
    category: token-structure
    decision: >
      `surface` = background for container components (accepts child
      content). `fill` = background for atomic control components.
      Structural role, kept as its own axis, separate from `concept`.
    rationale: >
      Container -> bg.surface.*, control -> bg.fill.*, resolved from the
      component's own classification (frontmatter in its COMPONENT.md —
      see the "container / control" entry below). Kept the existing
      term here since it names a structural role, not a brand-flavored
      concept (unlike brand/primary below, which was in scope for
      renaming).
    status: decided

  # ---- Color role keywords (the "concept" segment) ----

  - term: base
    category: color-role
    decision: >
      Use `base` for "no specific semantic color role applied" — the
      neutral value on the same `concept` axis as primary/destructive/
      caution/warning/info/success, reused across elements the same way
      `primary` is (`bg.surface.base`, `bg.fill.base`, `text.base`, etc).
    rationale: >
      Replaces Figma's "default"/"color-base" export names, neither of
      which described anything — every token is "the default"/"a color"
      of something. Not enforced via `supersedes`/`forbidden`: `default`
      is too common a word in general TS/JS to ban outright. Figma
      variables still need renaming to match (`text.color-base` should
      drop the leftover `color-` prefix too); `tokens:build` will
      re-label the existing `intent.yaml` entry automatically via its
      variableId once that lands. Not a reversal of the `size` entry's
      `default` sizing step below — different axis, different reasoning,
      see that entry.
    status: decided

  - term: raised
    category: elevation
    decision: >
      Reserved for a container background sitting above `base` (Card,
      Popover, etc.) — a new, separate axis from `concept` (color role)
      and from `surface`/`fill` (structural role): a surface can be
      `raised` regardless of what color role, if any, is layered on it.
      Not yet added to tokens-source/ — this fixes the word ahead of the
      token existing so it isn't renamed or reinvented later.
    status: decided

  - term: primary
    category: color-role
    decision: >
      Use `primary` for the main accent/CTA color role
      (`color.bg.fill.primary`, `color.text.primary`, etc).
    supersedes: brand
    rationale: >
      More familiar to React developers (Material UI convention). Reads
      as a UI role ("the main action") rather than asserting it's
      necessarily the brand color.
    status: decided

  - term: destructive
    category: color-role
    decision: >
      Use `destructive` as the single keyword covering both dangerous
      actions (delete buttons) AND error/failure states — do not use
      `critical` anywhere in new code or docs.
    supersedes: critical
    rationale: >
      Matches the vocabulary already in use in prior naming research.
      One term, not two synonyms for the same concept.
    status: decided

  - term: caution
    category: color-role
    decision: >
      Use `caution` for a mild, reversible heads-up state — lower
      severity than `warning`, higher than plain `info`. Same token
      shape as info/success/destructive (`bg.fill.caution.*`,
      `text.caution.*`, etc — see the semantic token naming formula
      entry above).
    rationale: >
      Keeps `caution` and `warning` as two rungs of one severity axis
      instead of picking a single winner: `info` < `caution` <
      `warning` < `destructive`. (`success` sits outside this axis — a
      positive outcome, not a severity level.) Matches prior research
      showing both terms used together; the earlier inconsistency was
      the lack of a fixed relationship between them, not the presence
      of two terms.
    status: decided

  - term: warning
    category: color-role
    decision: >
      Use `warning` for an elevated, needs-attention-soon state — more
      serious than `caution`, not yet blocking/destructive. Same token
      shape as info/success/destructive (`bg.fill.warning.*`,
      `text.warning.*`, etc).
    rationale: >
      One rung up from `caution` on the same severity axis — see the
      `caution` entry above for the full ordering and reasoning.
    status: decided

  - term: info
    category: color-role
    decision: "Use `info` for informational/neutral-attention states."
    rationale: "No conflict found; used consistently so far."
    status: decided

  - term: success
    category: color-role
    decision: "Use `success` for positive/completed states."
    rationale: "No conflict found; used consistently so far."
    status: decided

    # ---- Sizing ----

  - term: scale
    category: sizing
    decision: >
      Global context, `medium` | `large`, auto-detected from device
      pointer type via a media query, set once at a root
      provider/theme wrapper (not a per-component prop). Overridable
      at that same root for hybrid devices where auto-detection guesses
      wrong. Cascades to every component via CSS custom property
      indirection — see ADR 0001.
    rationale: >
      Adopted a systemwide-context model instead of a per-component
      `Small screen` boolean, which requires every new component to
      remember to wire up its own touch-target logic. Scale solves "is
      this a touch context" exactly once, systemwide.
    status: decided

  - term: size
    category: sizing
    decision: >
      Per-component t-shirt variant, three steps: `small` | `default` |
      `large`. Resizes one component instance, independent of `scale`.
      Never use `size` to mean "touch vs. pointer context" — that's
      `scale`.
    rationale: >
      `size` and `scale` were previously conflated (one system's own
      variant matrix mixes them into one `Size` property alongside a
      separate `Small screen` boolean). Middle step named `default`
      rather than `medium`: unlike the rejected color-role `default`
      (see `base` above), each component resolves `default`'s concrete
      pixel values via its own tokens, so the word here does describe
      something concrete — different axis, different failure mode, not
      a reversal of that decision.
    status: decided

  # ---- Component classification ----

  - term: container / control
    category: structural-classification
    decision: >
      `container` = accepts arbitrary child content (Card, Modal,
      Popover). `control` = atomic, self-contained element (Button,
      Badge). Recorded per-component in that component's own
      `<NAME>.md` blueprint (`classification` + `rationale`
      frontmatter) — no separate classification.yaml.
      Same distinction, reappearing elsewhere:
        - `intent.yaml`'s `classification` field on `surface`/`fill`
          tokens — derived, not hand-authored (role `surface` ->
          `container`, role `fill` -> `control`).
        - `border.control` — `control` fills the naming formula's
          `concept` slot as a plain description ("the border a control
          uses"); `classification` there is correctly `null`, since
          `border` has no `family` segment to derive it from.
        - `radius.control`/`radius.container` (see above) and
          `space.horizontal.control`/`space.horizontal.container` (plus
          their `.vertical.*` counterparts) — reuse the words directly,
          described rather than derived.
    rationale: "Determines which token family (surface/fill) a component uses."
    status: decided

  # ---- Interaction state vocabulary ----

  - term: state vocabulary
    category: state
    decision: "hover, active, selected, disabled, focus — no synonyms (never 'pressed' for active, never 'checked' for selected outside form-control-specific contexts)."
    forbidden: [pressed, checked]
    rationale: >
      Fixed list, consistent everywhere a state suffix is used, so state
      tokens are always inherited/derived from the same vocabulary.
    status: decided

  # ---- Abbreviations ----

  - term: bg
    category: abbreviation
    decision: "`bg` always means `background`. Never write `background` in full inside a token name."
    forbidden: [background]
    rationale: >
      If you abbreviate, the abbreviation must be fixed and exclusive —
      otherwise `bg` and `background` become two different tokens for
      the same concept.
    status: decided
